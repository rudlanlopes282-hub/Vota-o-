<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vota Aí - Pesquisa Eleitoral e Comprovante</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML2Canvas para geração de imagem / compartilhamento -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Custom Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-950">

  <div class="w-full max-w-md mx-auto space-y-6">

    <!-- CABEÇALHO -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-green-400 via-yellow-400 to-blue-500">
        VOTA-AÊ 2026
      </h1>
      <p class="text-xs text-slate-400 font-medium">Pesquisa de Opinião Pública & Comprovante Ilustrativo</p>
    </header>

    <!-- FORMULÁRIO DE VOTAÇÃO -->
    <div id="vote-form-container" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Seu Nome / Apelido</label>
          <input type="text" id="user-name" placeholder="Ex: MÁRIO" value="MÁRIO" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-yellow-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Estado (UF)</label>
            <select id="user-uf" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-100 focus:outline-none focus:border-yellow-500 transition">
              <option value="SP">São Paulo / SP</option>
              <option value="RJ" selected>Rio de Janeiro / RJ</option>
              <option value="MG">Minas Gerais / MG</option>
              <option value="BA">Bahia / BA</option>
              <option value="RS">Rio Grande do Sul / RS</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Opção de Voto</label>
            <select id="vote-option" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-100 focus:outline-none focus:border-yellow-500 transition">
              <option value="22" selected>FLÁVIO — 22</option>
              <option value="13">LULA — 13</option>
            </select>
          </div>
        </div>
      </div>

      <div class="pt-2 flex flex-col gap-3">
        <button onclick="submitVote(false)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-900/30 transition transform active:scale-98 text-sm">
          🗳️ Confirmar Voto (Versão Grátis)
        </button>
        <button onclick="submitVote(true)" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 transition transform active:scale-98 text-sm">
          ⚡ Confirmar Voto + Apoiar (Versão VIP)
        </button>
      </div>
    </div>

    <!-- MODAL DO COMPROVANTE (CARD COMPARTILHÁVEL) -->
    <div id="receipt-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden overflow-y-auto">
      <div class="w-full max-w-sm space-y-4 my-auto">
        
        <!-- CARD GERADO COM COMPROVANTE -->
        <div id="receipt-card" class="relative w-full aspect-[9/16] max-h-[640px] bg-slate-950 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between p-5 bg-cover bg-center transition-all duration-300">

          <!-- TOPO DO COMPROVANTE (TEXTOS HTML - OCULTOS NO PAGO) -->
          <div id="top-text-container" class="pt-2 text-center space-y-1 z-10 transition-opacity">
            <p id="top-badge" class="text-[10px] font-black tracking-widest text-emerald-400 uppercase">
              ⚡ ARTE ILUSTRATIVA — COMPROVANTE INDEPENDENTE ⚡
            </p>
            <p id="top-title" class="text-[11px] font-bold text-slate-300 tracking-wider uppercase">
              PAINEL BRASIL • ELEIÇÕES 2026
            </p>
          </div>

          <!-- CENTRO (ÍCONE E DESTAQUE DO CANDIDATO - VISÍVEL APENAS NO GRÁTIS) -->
          <div id="center-box" class="my-auto text-center space-y-3 z-10">
            <div class="w-16 h-16 bg-slate-900 border border-slate-800 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-inner">
              🏛️
            </div>
            <div>
              <p class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">PRESIDENTE</p>
              <h2 id="candidate-name-display" class="text-2xl font-black text-amber-400 tracking-wide mt-0.5">
                FLÁVIO — 22
              </h2>
            </div>
          </div>

          <!-- CAIXA / SELO DE VERIFICAÇÃO DO USUÁRIO -->
          <div id="seal-box" class="z-20 border rounded-2xl backdrop-blur-sm shadow-2xl text-center transition-all duration-300">
            <div id="seal-header" class="flex items-center justify-center gap-1 font-black uppercase text-emerald-400 tracking-wider">
              <span>✓</span>
              <span>VERIFICADO</span>
            </div>
            <p id="seal-subtitle" class="text-[8px] font-semibold text-slate-400 uppercase tracking-widest">PARTICIPANTE</p>
            
            <div id="seal-divider" class="my-1 border-t border-slate-800"></div>

            <p id="seal-user-name" class="font-extrabold text-slate-100 uppercase tracking-wide truncate">
              MÁRIO 👁️
            </p>
            <p id="seal-user-loc" class="font-medium text-emerald-400 tracking-wide truncate">
              Rio de Janeiro / RJ 👁️
            </p>
            <p id="seal-footer-tag" class="text-[8px] text-slate-400 uppercase mt-0.5 font-bold tracking-widest">
              PAINEL BRASIL
            </p>
          </div>

          <!-- FOOTER VAZIO APENAS PARA ESPAÇAMENTO INTERNO DO CARD -->
          <div class="h-2"></div>
        </div>

        <!-- BOTOES DE AÇÃO -->
        <div class="space-y-2.5">
          <button id="buy-btn" onclick="togglePaidState(true)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-xs transition transform active:scale-98">
            🎨 ADQUIRIR CARD COM FOTO E APOIAR A CAUSA
          </button>

          <button onclick="shareOrDownload()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-sm transition transform active:scale-98">
            📱 COMPARTILHAR NAS REDES SOCIAIS
          </button>

          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="copyReceiptText()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-semibold py-3 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
              Copiar Texto 📋
            </button>
            <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-semibold py-3 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
              Ir para o Debate 💬
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    let confirmedVoteData = {
      nome: 'MÁRIO',
      uf: 'Rio de Janeiro / RJ',
      opcao: '22',
      hasPaid: false
    };

    /**
     * Captura os dados do formulário e abre o comprovante
     */
    function submitVote(isPaid) {
      const nameInput = document.getElementById('user-name').value.trim() || 'PARTICIPANTE';
      const ufSelect = document.getElementById('user-uf');
      const ufText = ufSelect.options[ufSelect.selectedIndex].text;
      const voteOption = document.getElementById('vote-option').value;

      confirmedVoteData = {
        nome: nameInput.toUpperCase(),
        uf: ufText,
        opcao: voteOption,
        hasPaid: isPaid
      };

      openReceiptModal();
    }

    /**
     * Alterna rapidamente entre o estado Grátis e Pago na visualização
     */
    function togglePaidState(isPaid) {
      confirmedVoteData.hasPaid = isPaid;
      openReceiptModal();
    }

    /**
     * Configura o layout exato do comprovante dependendo se é Pago ou Grátis
     */
    function openReceiptModal() {
      const modal = document.getElementById('receipt-modal');
      const receiptCard = document.getElementById('receipt-card');
      const topTextContainer = document.getElementById('top-text-container');
      const centerBox = document.getElementById('center-box');
      const sealBox = document.getElementById('seal-box');
      const buyBtn = document.getElementById('buy-btn');

      // Atualiza textos do usuário
      document.getElementById('seal-user-name').textContent = `${confirmedVoteData.nome} 👁️`;
      document.getElementById('seal-user-loc').textContent = `${confirmedVoteData.uf} 👁️`;

      // Nome do candidato display
      const candidateNameDisplay = document.getElementById('candidate-name-display');
      if (confirmedVoteData.opcao === '22') {
        candidateNameDisplay.textContent = 'FLÁVIO — 22';
        candidateNameDisplay.className = 'text-2xl font-black text-amber-400 tracking-wide mt-0.5';
      } else {
        candidateNameDisplay.textContent = 'LULA — 13';
        candidateNameDisplay.className = 'text-2xl font-black text-red-500 tracking-wide mt-0.5';
      }

      if (confirmedVoteData.hasPaid) {
        // ==========================================
        // COMPROVANTE VIP / PAGO (COM FOTO DE FUNDO)
        // ==========================================
        buyBtn.classList.add('hidden');
        centerBox.classList.add('hidden');

        // Esconde os textos HTML do topo para NÃO sobrepor a imagem oficial
        topTextContainer.classList.add('opacity-0', 'pointer-events-none');

        // Imagem de fundo estilizada (Simulada com CSS gradient / imagem base)
        if (confirmedVoteData.opcao === '22') {
          receiptCard.style.backgroundImage = "linear-gradient(to bottom, rgba(3, 7, 18, 0.2), rgba(3, 7, 18, 0.8)), url('https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?auto=format&fit=crop&w=800&q=80')";
        } else {
          receiptCard.style.backgroundImage = "linear-gradient(to bottom, rgba(3, 7, 18, 0.2), rgba(3, 7, 18, 0.8)), url('https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?auto=format&fit=crop&w=800&q=80')";
        }

        /* 
         * AJUSTE PRINCIPAL SOLICITADO:
         * - Diminuído o tamanho do card do usuário (w-[130px] e textos compactos text-[10px]/text-[9px])
         * - Posicionado estrategicamente no ombro esquerdo (top-[26%] left-[4%])
         * - Evita cobrir o rosto dos candidatos e não polui o design
         */
        sealBox.className = `absolute top-[26%] left-[4%] w-[130px] bg-slate-950/90 border border-amber-500/50 rounded-xl p-2 text-center shadow-2xl backdrop-blur-md z-20`;
        
        document.getElementById('seal-header').className = 'flex items-center justify-center gap-1 font-black uppercase text-emerald-400 tracking-wider text-[10px]';
        document.getElementById('seal-user-name').className = 'font-bold text-slate-100 uppercase tracking-wide truncate text-[10px] mt-0.5';
        document.getElementById('seal-user-loc').className = 'font-medium text-emerald-400 tracking-wide truncate text-[9px]';
        
      } else {
        // ==========================================
        // COMPROVANTE GRATUITO (SEM FOTO DE FUNDO)
        // ==========================================
        buyBtn.classList.remove('hidden');
        centerBox.classList.remove('hidden');

        // Restaura a visibilidade dos textos do topo
        topTextContainer.classList.remove('opacity-0', 'pointer-events-none');

        // Remove imagem de fundo e aplica cor sólida limpa
        receiptCard.style.backgroundImage = "none";
        receiptCard.style.backgroundColor = "#090d16";

        // Centraliza o Selo com tamanho padrão na parte inferior
        sealBox.className = `w-[170px] bg-slate-950/90 border border-amber-500/40 rounded-2xl p-2.5 text-center shadow-2xl backdrop-blur-sm z-20 mx-auto mb-4`;
        
        document.getElementById('seal-header').className = 'flex items-center justify-center gap-1 font-black uppercase text-emerald-400 tracking-wider text-xs';
        document.getElementById('seal-user-name').className = 'font-extrabold text-slate-100 uppercase tracking-wide truncate text-xs mt-1';
        document.getElementById('seal-user-loc').className = 'font-semibold text-emerald-400 tracking-wide truncate text-[10px]';
      }

      modal.classList.remove('hidden');
    }

    /**
     * Fecha o modal
     */
    function closeModal() {
      document.getElementById('receipt-modal').classList.add('hidden');
    }

    /**
     * Copia texto promocional para área de transferência
     */
    function copyReceiptText() {
      const text = `Já registrei meu voto na Pesquisa Eleitoral 2026! 🗳️\nCandidato: ${confirmedVoteData.opcao === '22' ? 'FLÁVIO (22)' : 'LULA (13)'}\nParticipante: ${confirmedVoteData.nome} - ${confirmedVoteData.uf}\n\nVote você também em: vota-ae.vercel.app`;
      navigator.clipboard.writeText(text);
      alert('Texto copiado com sucesso!');
    }

    /**
     * Simula download / compartilhamento da imagem
     */
    function shareOrDownload() {
      const card = document.getElementById('receipt-card');
      html2canvas(card, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `comprovante-${confirmedVoteData.nome.toLowerCase()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
